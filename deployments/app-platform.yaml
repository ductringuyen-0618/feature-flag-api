name: feature-flag-api
region: nyc
databases:
  # Dev Postgres is allowed as an App Platform-managed database.
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
    production: false
  # Valkey has no App Platform "dev" tier; attach an existing managed cluster.
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: feature-flag-valkey
services:
  - name: api
    # DOCR image avoids requiring DigitalOcean↔GitHub OAuth in this environment.
    # Re-link GitHub later if you want deploy_on_push from the repo.
    image:
      registry_type: DOCR
      repository: feature-flag-api
      tag: latest
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /readyz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: PORT
        value: "8080"
      - key: RELOAD_INTERVAL
        value: "10s"
      - key: OVERRIDE_CACHE_TTL
        value: "60s"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ${valkey.DATABASE_URL}
